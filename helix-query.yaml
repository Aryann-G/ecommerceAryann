version: 1

indices:
  default:
    include:
      - /
      - /accessories
      - /lenovo

      # Add all your other PLP paths here:
      # - /laptops
      # - /smartphones
      # - /cameras
      # - /tablets
      # - /apple
      # - /samsung

    target: /query-index.json

    properties:
      title:
        selectFirst: 'head > meta[property="og:title"]'
        value: |
          attribute(el, 'content')

      description:
        selectFirst: 'head > meta[name="description"]'
        value: |
          attribute(el, 'content')

      image:
        selectFirst: 'head > meta[property="og:image"]'
        value: |
          match(attribute(el, 'content'), 'https:\/\/[^/]+(\/.*)')

      template:
        selectFirst: 'head > meta[name="template"]'
        value: |
          attribute(el, 'content')

      pageHeading:
        selectFirst: 'main h1'
        value: |
          textContent(el)

      firstProductImage:
        selectFirst: 'main .columns img'
        value: |
          attribute(el, 'src')

      productCards:
        select: 'main .columns > div > div'
        values: |
          textContent(el)
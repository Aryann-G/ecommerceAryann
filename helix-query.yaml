version: 1

indices:
  default:
    include:
      - /newarrivals
      - /categories/**
      - /brands/**
      - /product/**

    exclude:
      - /categories/index
      - /brands/index
      - /product/index

    target: /query-index.json

    properties:
      title:
        selectFirst: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')

      description:
        selectFirst: head > meta[name="description"]
        value: |
          attribute(el, 'content')

      image:
        selectFirst: head > meta[property="og:image"]
        value: |
          match(attribute(el, 'content'), 'https:\/\/[^/]+(\/.*)')

      template:
        selectFirst: head > meta[name="template"]
        value: |
          attribute(el, 'content')

      productId:
        selectFirst: head > meta[name="product-id"]
        value: |
          attribute(el, 'content')

      productName:
        selectFirst: head > meta[name="product-name"]
        value: |
          attribute(el, 'content')

      brand:
        selectFirst: head > meta[name="brand"], head > meta[name="product-brand"], head > meta[name="productBrand"]
        value: |
          attribute(el, 'content')

      category:
        selectFirst: head > meta[name="category"], head > meta[name="product-category"], head > meta[name="productCategory"], head > meta[property="article:section"]
        value: |
          attribute(el, 'content')

      price:
        selectFirst: head > meta[name="price"]
        value: |
          attribute(el, 'content')

      type:
        selectFirst: head > meta[name="type"], head > meta[name="product-type"], head > meta[name="productType"]
        value: |
          attribute(el, 'content')

      tag:
        selectFirst: head > meta[name="tag"]
        value: |
          attribute(el, 'content')

      colors:
        selectFirst: head > meta[name="colors"]
        value: |
          attribute(el, 'content')

      stockStatus:
        selectFirst: head > meta[name="stock-status"]
        value: |
          attribute(el, 'content')

      delivery:
        selectFirst: head > meta[name="delivery"]
        value: |
          attribute(el, 'content')

      imageAlt:
        selectFirst: head > meta[name="image-alt"]
        value: |
          attribute(el, 'content')
version: 1

indices:
  default:
    include:
      - /**

    exclude:
      - /nav/**
      - /footer/**
      - /configuration/**
      - /fragments/**
      - /metadata/**
      - /style-guide/**

    target: /query-index.json

    properties:
      # =========================================
      # General page information
      # Applicable to homepage, category pages,
      # PDPs, Cart, Checkout, etc.
      # =========================================

      title:
        select: 'head > meta[property="og:title"]'
        value: |
          attribute(el, 'content')

      pageDescription:
        select: 'head > meta[name="description"]'
        value: |
          attribute(el, 'content')

      pageImage:
        select: 'head > meta[property="og:image"]'
        value: |
          attribute(el, 'content')

      template:
        select: 'head > meta[name="template"]'
        value: |
          attribute(el, 'content')

      pageHeading:
        select: 'main h1'
        value: |
          textContent(el)

      pageContent:
        select: 'main'
        value: |
          textContent(el)

      # =========================================
      # Product Detail page information
      # These fields populate only on pages
      # containing the Product Detail block.
      # =========================================

      productId:
        select: 'main .product-detail > div:nth-child(1) > div:nth-child(2)'
        value: |
          textContent(el)

      productName:
        select: 'main .product-detail > div:nth-child(2) > div:nth-child(2)'
        value: |
          textContent(el)

      brand:
        select: 'main .product-detail > div:nth-child(3) > div:nth-child(2)'
        value: |
          textContent(el)

      category:
        select: 'main .product-detail > div:nth-child(4) > div:nth-child(2)'
        value: |
          textContent(el)

      image:
        select: 'main .product-detail > div:nth-child(5) > div:nth-child(2) img'
        value: |
          attribute(el, 'src')

      imageAlt:
        select: 'main .product-detail > div:nth-child(6) > div:nth-child(2)'
        value: |
          textContent(el)

      price:
        select: 'main .product-detail > div:nth-child(7) > div:nth-child(2)'
        value: |
          textContent(el)

      description:
        select: 'main .product-detail > div:nth-child(8) > div:nth-child(2)'
        value: |
          textContent(el)

      stock:
        select: 'main .product-detail > div:nth-child(9) > div:nth-child(2)'
        value: |
          textContent(el)

      delivery:
        select: 'main .product-detail > div:nth-child(10) > div:nth-child(2)'
        value: |
          textContent(el)

      # =========================================
      # Cart page authored information
      # These fields populate only on /cart.
      # =========================================

      cartHeading:
        select: 'main .cart > div:nth-child(1) > div:nth-child(2)'
        value: |
          textContent(el)

      cartEmptyTitle:
        select: 'main .cart > div:nth-child(2) > div:nth-child(2)'
        value: |
          textContent(el)

      cartEmptyMessage:
        select: 'main .cart > div:nth-child(3) > div:nth-child(2)'
        value: |
          textContent(el)

      cartContinueLabel:
        select: 'main .cart > div:nth-child(4) > div:nth-child(2)'
        value: |
          textContent(el)

      cartContinueLink:
        select: 'main .cart > div:nth-child(5) > div:nth-child(2) a'
        value: |
          attribute(el, 'href')

      cartSummaryHeading:
        select: 'main .cart > div:nth-child(6) > div:nth-child(2)'
        value: |
          textContent(el)

      cartItemsLabel:
        select: 'main .cart > div:nth-child(7) > div:nth-child(2)'
        value: |
          textContent(el)

      cartSubtotalLabel:
        select: 'main .cart > div:nth-child(8) > div:nth-child(2)'
        value: |
          textContent(el)

      cartTotalLabel:
        select: 'main .cart > div:nth-child(9) > div:nth-child(2)'
        value: |
          textContent(el)

      cartCheckoutLabel:
        select: 'main .cart > div:nth-child(10) > div:nth-child(2)'
        value: |
          textContent(el)

      cartCheckoutLink:
        select: 'main .cart > div:nth-child(11) > div:nth-child(2) a'
        value: |
          attribute(el, 'href')

      cartClearLabel:
        select: 'main .cart > div:nth-child(12) > div:nth-child(2)'
        value: |
          textContent(el)

      cartContent:
        select: 'main .cart'
        value: |
          textContent(el)

      # =========================================
      # Checkout page authored information
      # These fields populate only on /checkout.
      # =========================================

      checkoutHeading:
        select: 'main .checkout > div:nth-child(1) > div:nth-child(2)'
        value: |
          textContent(el)

      checkoutContent:
        select: 'main .checkout'
        value: |
          textContent(el)

      # =========================================
      # Page status
      # =========================================

      robots:
        select: 'head > meta[name="robots"]'
        value: |
          attribute(el, 'content')
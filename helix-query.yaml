version: 1

indices:
  default:
    include:
      - /
      - /newarrivals
      - /categories/**
      - /brands/**
      - /product/**

    exclude:
      - /product/index

    target: /query-index.json

    properties:
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')

      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, 'content')

      image:
        select: head > meta[property="og:image"]
        value: |
          match(attribute(el, 'content'), 'https:\/\/[^/]+(\/.*)')

      template:
        select: head > meta[name="template"]
        value: |
          attribute(el, 'content')

      productId:
        select: head > meta[name="product-id"]
        value: |
          attribute(el, 'content')

      brand:
        select: head > meta[name="brand"]
        value: |
          attribute(el, 'content')

      category:
        select: head > meta[name="category"]
        value: |
          attribute(el, 'content')

      price:
        select: head > meta[name="price"]
        value: |
          attribute(el, 'content')

      type:
        select: head > meta[name="type"]
        value: |
          attribute(el, 'content')

      tag:
        select: head > meta[name="tag"]
        value: |
          attribute(el, 'content')

      colors:
        select: head > meta[name="colors"]
        value: |
          attribute(el, 'content')

      stockStatus:
        select: head > meta[name="stock-status"]
        value: |
          attribute(el, 'content')

      delivery:
        select: head > meta[name="delivery"]
        value: |
          attribute(el, 'content')

      imageAlt:
        select: head > meta[name="image-alt"]
        value: |
          attribute(el, 'content')
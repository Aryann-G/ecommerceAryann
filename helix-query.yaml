version: 1

indices:
  default:
    include:
      - /**

    exclude:
      - /configuration/**
      - /nav/**
      - /footer/**
      - /metadata/**
      - /fragments/**
      - /style-guide/**

    target: /query-index.json

    properties:
      # ==========================================
      # General information for every page
      # ==========================================

      title:
        selectFirst: 'head > meta[property="og:title"]'
        value: |
          attribute(el, 'content')

      description:
        selectFirst: 'head > meta[name="description"]'
        value: |
          attribute(el, 'content')

      image:
        selectFirst: 'head > meta[property="og:image"]'
        value: |
          attribute(el, 'content')

      template:
        selectFirst: 'head > meta[name="template"]'
        value: |
          attribute(el, 'content')

      robots:
        selectFirst: 'head > meta[name="robots"]'
        value: |
          attribute(el, 'content')

      pageHeading:
        selectFirst: 'main h1'
        value: |
          textContent(el)

      # ==========================================
      # Product Detail block information
      # ==========================================

      productId:
        selectFirst: 'main .product-detail > div:nth-child(1) > div:nth-child(2)'
        value: |
          textContent(el)

      productName:
        selectFirst: 'main .product-detail > div:nth-child(2) > div:nth-child(2)'
        value: |
          textContent(el)

      brand:
        selectFirst: 'main .product-detail > div:nth-child(3) > div:nth-child(2)'
        value: |
          textContent(el)

      category:
        selectFirst: 'main .product-detail > div:nth-child(4) > div:nth-child(2)'
        value: |
          textContent(el)

      productImage:
        selectFirst: 'main .product-detail > div:nth-child(5) > div:nth-child(2) img'
        value: |
          attribute(el, 'src')

      productImageAlt:
        selectFirst: 'main .product-detail > div:nth-child(6) > div:nth-child(2)'
        value: |
          textContent(el)

      price:
        selectFirst: 'main .product-detail > div:nth-child(7) > div:nth-child(2)'
        value: |
          textContent(el)

      productDescription:
        selectFirst: 'main .product-detail > div:nth-child(8) > div:nth-child(2)'
        value: |
          textContent(el)

      stock:
        selectFirst: 'main .product-detail > div:nth-child(9) > div:nth-child(2)'
        value: |
          textContent(el)

      delivery:
        selectFirst: 'main .product-detail > div:nth-child(10) > div:nth-child(2)'
        value: |
          textContent(el)

      # ==========================================
      # Cart block authored information
      # ==========================================

      cartHeading:
        selectFirst: 'main .cart > div:nth-child(1) > div:nth-child(2)'
        value: |
          textContent(el)

      cartEmptyTitle:
        selectFirst: 'main .cart > div:nth-child(2) > div:nth-child(2)'
        value: |
          textContent(el)

      cartEmptyMessage:
        selectFirst: 'main .cart > div:nth-child(3) > div:nth-child(2)'
        value: |
          textContent(el)

      cartSummaryHeading:
        selectFirst: 'main .cart > div:nth-child(6) > div:nth-child(2)'
        value: |
          textContent(el)

      cartSubtotalLabel:
        selectFirst: 'main .cart > div:nth-child(8) > div:nth-child(2)'
        value: |
          textContent(el)

      cartTotalLabel:
        selectFirst: 'main .cart > div:nth-child(9) > div:nth-child(2)'
        value: |
          textContent(el)

      cartCheckoutLabel:
        selectFirst: 'main .cart > div:nth-child(10) > div:nth-child(2)'
        value: |
          textContent(el)

      cartContent:
        selectFirst: 'main .cart'
        value: |
          textContent(el)

      # ==========================================
      # Checkout block authored information
      # ==========================================

      checkoutHeading:
        selectFirst: 'main .checkout > div:nth-child(1) > div:nth-child(2)'
        value: |
          textContent(el)

      checkoutContactHeading:
        selectFirst: 'main .checkout > div:nth-child(2) > div:nth-child(2)'
        value: |
          textContent(el)

      checkoutDeliveryHeading:
        selectFirst: 'main .checkout > div:nth-child(5) > div:nth-child(2)'
        value: |
          textContent(el)

      checkoutPaymentHeading:
        selectFirst: 'main .checkout > div:nth-child(11) > div:nth-child(2)'
        value: |
          textContent(el)

      checkoutSummaryHeading:
        selectFirst: 'main .checkout > div:nth-child(14) > div:nth-child(2)'
        value: |
          textContent(el)

      checkoutSubtotalLabel:
        selectFirst: 'main .checkout > div:nth-child(16) > div:nth-child(2)'
        value: |
          textContent(el)

      checkoutShippingLabel:
        selectFirst: 'main .checkout > div:nth-child(17) > div:nth-child(2)'
        value: |
          textContent(el)

      checkoutTotalLabel:
        selectFirst: 'main .checkout > div:nth-child(19) > div:nth-child(2)'
        value: |
          textContent(el)

      checkoutPlaceOrderLabel:
        selectFirst: 'main .checkout > div:nth-child(20) > div:nth-child(2)'
        value: |
          textContent(el)

      checkoutSuccessTitle:
        selectFirst: 'main .checkout > div:nth-child(27) > div:nth-child(2)'
        value: |
          textContent(el)

      checkoutDownloadPdfLabel:
        selectFirst: 'main .checkout > div:nth-child(29) > div:nth-child(2)'
        value: |
          textContent(el)

      checkoutContent:
        selectFirst: 'main .checkout'
        value: |
          textContent(el)
version: 1

indices:
  default:
    include:
      - /**

    exclude:
      - /configuration/**
      - /nav/**
      - /footer/**
      - /metadata/**
      - /fragments/**
      - /style-guide/**

      # Exclude non-PLP pages
      - /appletg
      - /ipadtg
      - /mactg
      - /penciltg
      - /samsungtg
      - /sonytg
      - /cart
      - /checkout
      - /ecommercearyann/home
      - /ecommercearyanncap/home

    target: /query-index.json

    properties:
      title:
        selectFirst: 'head > meta[property="og:title"]'
        value: |
          attribute(el, 'content')

      description:
        selectFirst: 'head > meta[name="description"]'
        value: |
          attribute(el, 'content')

      image:
        selectFirst: 'head > meta[property="og:image"]'
        value: |
          match(attribute(el, 'content'), 'https:\/\/[^/]+(\/.*)')

      pageHeading:
        selectFirst: 'main h1:first-of-type'
        value: |
          textContent(el)

      firstProductImage:
        selectFirst: 'main .columns img'
        value: |
          attribute(el, 'src')

      listingContent:
        selectFirst: 'main .columns'
        value: |
          textContent(el)
version: 1

indices:
  products:
    include:
      - /**

    exclude:
      - /nav/**
      - /footer/**
      - /configuration/**
      - /fragments/**
      - /metadata/**
      - /style-guide/**

    target: /query-index.json

    properties:
      # General page information
      title:
        selectFirst: 'head > meta[property="og:title"]'
        value: |
          attribute(el, 'content')

      pageDescription:
        selectFirst: 'head > meta[name="description"]'
        value: |
          attribute(el, 'content')

      pageImage:
        selectFirst: 'head > meta[property="og:image"]'
        value: |
          attribute(el, 'content')

      template:
        selectFirst: 'head > meta[name="template"]'
        value: |
          attribute(el, 'content')

      # Product Detail information
      productId:
        selectFirst: 'main .product-detail > div:nth-child(1) > div:nth-child(2)'
        value: |
          textContent(el)

      productName:
        selectFirst: 'main .product-detail > div:nth-child(2) > div:nth-child(2)'
        value: |
          textContent(el)

      brand:
        selectFirst: 'main .product-detail > div:nth-child(3) > div:nth-child(2)'
        value: |
          textContent(el)

      category:
        selectFirst: 'main .product-detail > div:nth-child(4) > div:nth-child(2)'
        value: |
          textContent(el)

      image:
        selectFirst: 'main .product-detail > div:nth-child(5) > div:nth-child(2) img'
        value: |
          attribute(el, 'src')

      imageAlt:
        selectFirst: 'main .product-detail > div:nth-child(6) > div:nth-child(2)'
        value: |
          textContent(el)

      price:
        selectFirst: 'main .product-detail > div:nth-child(7) > div:nth-child(2)'
        value: |
          textContent(el)

      description:
        selectFirst: 'main .product-detail > div:nth-child(8) > div:nth-child(2)'
        value: |
          textContent(el)

      stock:
        selectFirst: 'main .product-detail > div:nth-child(9) > div:nth-child(2)'
        value: |
          textContent(el)

      delivery:
        selectFirst: 'main .product-detail > div:nth-child(10) > div:nth-child(2)'
        value: |
          textContent(el)
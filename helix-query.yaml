version: 1

indices:
  default:
    include:
      - /**

    exclude:
      - /configuration/**
      - /nav/**
      - /footer/**
      - /metadata/**
      - /fragments/**
      - /style-guide/**

      # PDP pages
      - /appletg
      - /ipadtg
      - /mactg
      - /penciltg
      - /samsungtg
      - /sonytg

      # Commerce pages
      - /cart
      - /checkout

    target: /query-index.json

    properties:
      title:
        select: 'head > meta[property="og:title"]'
        value: |
          attribute(el, 'content')

      description:
        select: 'head > meta[name="description"]'
        value: |
          attribute(el, 'content')

      image:
        select: 'head > meta[property="og:image"]'
        value: |
          match(attribute(el, 'content'), 'https:\/\/[^/]+(\/.*)')

      template:
        select: 'head > meta[name="template"]'
        value: |
          attribute(el, 'content')

      pageHeading:
        select: 'main h1:first-of-type'
        value: |
          textContent(el)

      listingContent:
        select: 'main .columns'
        value: |
          textContent(el)